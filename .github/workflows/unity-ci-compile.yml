name: Unity CI (Compile)

on:
  pull_request:
    branches:
      - Ground
      - feature/**
  push:
    branches:
      - feature/**

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unity Builder (compile check)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.2.10f1
          targetPlatform: StandaloneLinux64
          buildName: CI-Compile-Check
          versioning: None

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            /github/home/.local/share/unity3d/Editor/Editor.log
            /github/home/.local/share/unity3d/Unity*/Editor.log
